<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>La casa</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/kiosk.js" defer></script>
</head>
<body class="kiosk">
<main class="board">
  <section class="card clock-card">
    <div id="time" class="time">--:--</div>
    <div id="date" class="date"></div>
  </section>

  <section id="weather" class="card weather-card">
    <div class="weather-main">
      <span id="weather-icon" class="weather-icon" aria-hidden="true"></span>
      <span id="temperature" class="temperature">--°</span>
    </div>
    <div id="sky" class="sky"></div>
    <div class="chips">
      <span id="chip-max" class="chip"></span>
      <span id="chip-min" class="chip"></span>
      <span id="chip-rain" class="chip"></span>
    </div>
  </section>

  <section class="card next-card">
    <div class="eyebrow">Lo próximo</div>
    <div id="next-title" class="next-title"></div>
    <div id="next-meta" class="next-meta"></div>
  </section>

  <section class="card today-card">
    <div class="card-head"><h2>Hoy</h2><span id="count-today" class="count">0</span></div>
    <ul id="today" class="timeline"></ul>
  </section>

  <section class="card list-card compras-card">
    <div class="card-head"><h2>🛒 Compras</h2><span id="count-compras" class="count">0</span></div>
    <form id="add-compras" class="add-item" hidden>
      <input id="add-compras-text" type="text" maxlength="500" autocomplete="off" enterkeyhint="done" placeholder="Agregar…" aria-label="Agregar a compras">
      <button type="submit" aria-label="Agregar">+</button>
    </form>
    <ul id="list-compras" class="checklist"></ul>
  </section>

  <section class="card list-card pendientes-card">
    <div class="card-head"><h2>✅ Pendientes</h2><span id="count-pendientes" class="count">0</span></div>
    <form id="add-pendientes" class="add-item" hidden>
      <input id="add-pendientes-text" type="text" maxlength="500" autocomplete="off" enterkeyhint="done" placeholder="Agregar…" aria-label="Agregar a pendientes">
      <button type="submit" aria-label="Agregar">+</button>
    </form>
    <ul id="list-pendientes" class="checklist"></ul>
  </section>
</main>
<p id="problems" class="problems"></p>
</body>
</html>
