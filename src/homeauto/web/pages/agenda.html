<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Agenda de la casa</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/fullcalendar-6.1.21/index.global.min.js" defer></script>
<script src="/static/fullcalendar-6.1.21/es.global.min.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body class="agenda">
<div class="agenda-page">
  <header class="topbar">
    <h1 id="title">Agenda de la casa</h1>
    <div class="nav">
      <button type="button" class="round" id="prev" aria-label="Anterior">‹</button>
      <button type="button" class="ghost" id="today">Hoy</button>
      <button type="button" class="round" id="next" aria-label="Siguiente">›</button>
    </div>
    <div class="segmented" id="views">
      <button type="button" data-view="dayGridMonth" class="on">Mes</button>
      <button type="button" data-view="timeGridWeek">Semana</button>
      <button type="button" data-view="timeGridDay">Día</button>
      <button type="button" data-view="listWeek">Lista</button>
    </div>
    <a class="ghost" href="/pantalla">Pantalla</a>
  </header>

  <div id="problems" class="problems" hidden></div>
  <ul id="legend" class="legend"></ul>

  <div class="card calendar-card"><div id="calendar"></div></div>
</div>

<button type="button" class="fab" id="new-job" hidden><span>+</span> Nuevo aviso</button>

<div id="detail" class="sheet-wrap" hidden>
  <div class="sheet">
    <div class="grip"></div>
    <h2 id="detail-title"></h2>
    <p id="detail-when" class="sub"></p>
    <p id="detail-where"></p>
    <ul id="detail-marks"></ul>
    <div class="sheet-actions">
      <button type="button" id="detail-delete" class="btn danger" hidden>Borrar</button>
      <button type="button" id="detail-close" class="btn quiet">Cerrar</button>
      <button type="button" id="detail-edit" class="btn primary" hidden>Editar</button>
    </div>
  </div>
</div>

<div id="editor" class="sheet-wrap" hidden>
  <form id="editor-form" class="sheet" novalidate>
    <div class="grip"></div>
    <h2 id="editor-title">Nuevo aviso</h2>
    <p class="sub">Suena en la casa y avisa por Telegram.</p>
    <input type="hidden" id="editor-type" value="alarm">
    <div class="types" id="editor-types" role="group" aria-label="Tipo">
      <button type="button" data-type="alarm" class="on"><b>⏰</b>Alarma</button>
      <button type="button" data-type="reminder"><b>📌</b>Recordatorio</button>
      <button type="button" data-type="timer"><b>⏲️</b>Timer</button>
    </div>
    <label class="field"><span>Mensaje</span>
      <textarea id="editor-message" maxlength="500" rows="2" required></textarea>
    </label>
    <label class="field"><span>Cuándo</span>
      <input type="datetime-local" id="editor-when" required>
    </label>
    <label class="field"><span>Se repite</span>
      <select id="editor-repeat">
        <option value="once">Una sola vez</option>
        <option value="daily">Todos los días</option>
        <option value="weekly">Algunos días</option>
      </select>
    </label>
    <div id="editor-days" class="days-row" role="group" aria-label="Días" hidden>
      <button type="button" data-day="1" aria-label="Lunes" aria-pressed="false">L</button>
      <button type="button" data-day="2" aria-label="Martes" aria-pressed="false">M</button>
      <button type="button" data-day="3" aria-label="Miércoles" aria-pressed="false">M</button>
      <button type="button" data-day="4" aria-label="Jueves" aria-pressed="false">J</button>
      <button type="button" data-day="5" aria-label="Viernes" aria-pressed="false">V</button>
      <button type="button" data-day="6" aria-label="Sábado" aria-pressed="false">S</button>
      <button type="button" data-day="7" aria-label="Domingo" aria-pressed="false">D</button>
    </div>
    <label class="field"><span>Equipo</span>
      <select id="editor-device">
        <option value="">El de siempre</option>
      </select>
    </label>
    <label class="field" id="editor-author-label"><span>A nombre de</span>
      <select id="editor-author"></select>
    </label>
    <p id="editor-error" class="problems" hidden></p>
    <div class="sheet-actions">
      <button type="button" id="editor-cancel" class="btn quiet">Cancelar</button>
      <button type="submit" id="editor-save" class="btn primary">Guardar</button>
    </div>
  </form>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
