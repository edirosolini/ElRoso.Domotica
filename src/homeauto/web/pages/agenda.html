<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Agenda de la casa</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/fullcalendar-6.1.21/index.global.min.js" defer></script>
<script src="/static/fullcalendar-6.1.21/es.global.min.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body class="agenda">
<header class="bar">
  <h1>Agenda de la casa</h1>
  <button type="button" id="new-job" class="primary" hidden>Nuevo aviso</button>
  <a href="/pantalla">Pantalla</a>
</header>
<div id="problems" class="problems" hidden></div>
<ul id="legend" class="legend"></ul>
<div id="calendar"></div>
<div id="detail" class="detail" hidden>
  <div class="detail-card">
    <h2 id="detail-title"></h2>
    <p id="detail-when"></p>
    <p id="detail-where"></p>
    <ul id="detail-marks"></ul>
    <div class="actions">
      <button type="button" id="detail-edit" hidden>Editar</button>
      <button type="button" id="detail-delete" class="danger" hidden>Borrar</button>
      <button type="button" id="detail-close">Cerrar</button>
    </div>
  </div>
</div>
<div id="editor" class="detail" hidden>
  <form id="editor-form" class="detail-card" novalidate>
    <h2 id="editor-title">Nuevo aviso</h2>
    <label>Tipo
      <select id="editor-type">
        <option value="alarm">Alarma</option>
        <option value="reminder">Recordatorio</option>
        <option value="timer">Timer</option>
      </select>
    </label>
    <label>Mensaje
      <textarea id="editor-message" maxlength="500" rows="2" required></textarea>
    </label>
    <label>Fecha y hora
      <input type="datetime-local" id="editor-when" required>
    </label>
    <label>Repetición
      <select id="editor-repeat">
        <option value="once">Una sola vez</option>
        <option value="daily">Todos los días</option>
        <option value="weekly">Algunos días</option>
      </select>
    </label>
    <fieldset id="editor-days" class="days" hidden>
      <legend>Días</legend>
      <label><input type="checkbox" value="1">Lun</label>
      <label><input type="checkbox" value="2">Mar</label>
      <label><input type="checkbox" value="3">Mié</label>
      <label><input type="checkbox" value="4">Jue</label>
      <label><input type="checkbox" value="5">Vie</label>
      <label><input type="checkbox" value="6">Sáb</label>
      <label><input type="checkbox" value="7">Dom</label>
    </fieldset>
    <label>Equipo
      <select id="editor-device">
        <option value="">El de siempre</option>
      </select>
    </label>
    <label id="editor-author-label">A nombre de
      <select id="editor-author"></select>
    </label>
    <p id="editor-error" class="problems" hidden></p>
    <div class="actions">
      <button type="submit" id="editor-save" class="primary">Guardar</button>
      <button type="button" id="editor-cancel">Cancelar</button>
    </div>
  </form>
</div>
</body>
</html>
